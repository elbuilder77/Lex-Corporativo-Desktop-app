name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-windows:
    name: Build & Publish Windows Installer (.exe)
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prebuild assets, model embeddings and rebuild native modules
        run: npm run prebuild:electron

      - name: Build Electron frontend and main process
        run: npm run build

      - name: Package installer and publish Release to GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --config electron-builder.config.json --win --publish always

      - name: Ensure release is published publicly (not draft)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Start-Sleep -Seconds 5
          $tagName = "${{ github.ref_name }}"
          Write-Host "Checking release status for tag: $tagName"
          try {
            $releaseInfo = gh release view $tagName --json isDraft,tagName 2>$null | ConvertFrom-Json
            if ($releaseInfo -and $releaseInfo.isDraft) {
              Write-Host "Converting draft release to public for $tagName..."
              gh release edit $tagName --draft=false
            } else {
              Write-Host "Release for $tagName is already published publicly."
            }
          } catch {
            Write-Host "Release check handled: electron-builder managed the publication directly."
          }

