[package]
name = "lex-engine"
version = "0.1.0"
edition = "2021"
description = "Motor local de inferencia juridica para Lex Corporativo"

[features]
default = []
gpu-vulkan = ["llama-cpp-2/vulkan"]
gpu-cuda = ["llama-cpp-2/cuda"]
gpu-metal = ["llama-cpp-2/metal"]

[dependencies]
# Runtime Asíncrono
tokio = { version = "1.32", features = ["full"] }

# Serialización / Deserialización (IPC JSON)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Inferencia LLM Local (Zero-Cloud)
# Usamos bindings de llama.cpp optimizados para CPU/Metal.
# Para compilar en Mac M1/M2/M3 habilitar el feature `metal`.
llama-cpp-2 = { version = "0.1.146", features = [] }
encoding_rs = "0.8"
